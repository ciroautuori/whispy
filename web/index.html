<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="Whispy Brain — Notion + Obsidian hybrid. Nested HyperKanban, markdown notes, backlinks, graph view.">
<title>Whispy Brain</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <button id="navToggle" class="icon-btn" aria-label="Menu">
      <svg viewBox="0 0 24 24" width="20" height="20"><path d="M3 3h7v7H3zM3 14h7v7H3zM14 3h7v7h-7zM14 14h7v7h-7z" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
    </button>
    <input id="search" class="search" autocomplete="off" placeholder="Search brain…  / to focus">
    <button id="themeToggle" class="icon-btn" aria-label="Theme">🌙</button>
  </header>

  <nav id="rail" class="rail">
    <button data-view="tree" class="rail-btn active" title="Tree">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M3 6h6M3 12h12M3 18h18" stroke="currentColor" stroke-width="1.8"/></svg>
      <span>Tree</span>
    </button>
    <button data-view="kanban" class="rail-btn" title="Kanban">
      <svg viewBox="0 0 24 24" width="22" height="22"><rect x="3" y="4" width="5" height="16" fill="none" stroke="currentColor" stroke-width="1.6" rx="1.5"/><rect x="10" y="4" width="5" height="10" fill="none" stroke="currentColor" stroke-width="1.6" rx="1.5"/><rect x="17" y="4" width="4" height="13" fill="none" stroke="currentColor" stroke-width="1.6" rx="1.5"/></svg>
      <span>Kanban</span>
    </button>
    <button data-view="notes" class="rail-btn" title="Notes">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M6 3h10l4 4v14H6zM6 3v18M14 3v6h4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      <span>Notes</span>
    </button>
    <button data-view="graph" class="rail-btn" title="Graph">
      <svg viewBox="0 0 24 24" width="22" height="22"><circle cx="6" cy="6" r="2.5" fill="currentColor"/><circle cx="18" cy="6" r="2.5" fill="currentColor"/><circle cx="12" cy="18" r="2.5" fill="currentColor"/><line x1="7.5" y1="6" x2="15.5" y2="6" stroke="currentColor" stroke-width="1.5"/><line x1="7" y1="7.5" x2="11" y2="16" stroke="currentColor" stroke-width="1.5"/><line x1="17" y1="7.5" x2="13" y2="16" stroke="currentColor" stroke-width="1.5"/></svg>
      <span>Graph</span>
    </button>
    <button data-view="stats" class="rail-btn" title="Stats">
      <svg viewBox="0 0 24 24" width="22" height="22"><rect x="4" y="10" width="3" height="10" fill="currentColor"/><rect x="10" y="4" width="3" height="16" fill="currentColor"/><rect x="16" y="14" width="3" height="6" fill="currentColor"/></svg>
      <span>Stats</span>
    </button>
  </nav>

  <main id="content" class="content"></main>

  <div id="editor" class="editor hidden">
    <header class="editor-hd">
      <button id="editorBack" class="icon-btn" aria-label="Back">←</button>
      <select id="editorType" class="editor-type-select"></select>
      <input id="editorTitle" class="editor-title" placeholder="Untitled">
      <div class="editor-meta">
        <select id="editorStatus"></select>
        <select id="editorPriority"></select>
        <button id="editorMenu" class="icon-btn" aria-label="Menu">⋮</button>
      </div>
    </header>
    <input id="editorDue" class="editor-due" type="date" placeholder="Due">
    <input id="editorTags" class="editor-tags" placeholder="tags comma separated">
    <textarea id="editorBody" class="editor-body" placeholder="Markdown here… use [[wikilinks]] to connect notes

# Headings
- lists
**bold** *italic*
[[Note Title]] → backlink"></textarea>
    <footer class="editor-ft">
      <div id="editorBacklinks" class="backlinks"></div>
    </footer>
  </div>

  <button id="addBtn" class="fab" title="Quick add (N)">+</button>

  <div id="toast" class="toast hidden"></div>
</div>
<script src="main.js"></script>
</body>
</html>
