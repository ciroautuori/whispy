name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Pytest & Ruff
    runs-on: [self-hosted, soliso, whispy]

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip --quiet
          pip install ruff pytest --quiet
          pip install -e . --quiet

      - name: Lint with Ruff
        run: ruff check .

      - name: Run tests
        run: pytest tests/ -v --tb=short
