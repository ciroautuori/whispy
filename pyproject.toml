[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "whispy"
version = "0.4.0"
description = "Dettatura vocale locale per Linux — tieni premuto, parla, rilascia. Zero cloud."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ciro Autuori" }]
keywords = [
  "whisper", "speech-to-text", "dictation", "stt", "voice-typing",
  "push-to-talk", "wayland", "linux", "offline", "privacy", "whisper-cpp",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Utilities",
  "Environment :: X11 Applications",
  "Natural Language :: Italian",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["ruff>=0.6", "pytest>=8.0"]
ptt = ["evdev>=1.6"]
groq = ["groq>=0.9"]
openai = ["openai>=1.0"]
faster-whisper = ["faster-whisper>=1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[project.urls]
Homepage = "https://github.com/ciroautuori/whispy"
Repository = "https://github.com/ciroautuori/whispy"
Issues = "https://github.com/ciroautuori/whispy/issues"
Changelog = "https://github.com/ciroautuori/whispy/blob/main/CHANGES.md"

[project.scripts]
whispy = "whispy.__main__:main"
whispy-gui = "whispy.gui:main"

[tool.hatch.build.targets.wheel]
packages = ["whispy"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
