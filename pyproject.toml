[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "whispy"
version = "0.1.0"
description = "Local speech-to-text and Second Brain desktop app — press once to record, press again to transcribe. Notion + Obsidian hybrid notes with HyperKanban nested tasks."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Ciro Autuori" },
]
keywords = ["whisper", "speech-to-text", "dictation", "stt", "second-brain", "notion", "obsidian", "kanban", "desktop", "wayland"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: X11 Applications",
  "Environment :: Win32 Systems (MS Windows)",
  "Environment :: MacOS X",
  "Intended Audience :: End Users/Desktop",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Office/Business :: Groupware",
  "Topic :: Text Editors",
  "Topic :: Utilities",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
desktop = [
  "pywebview>=5.0",
  "PyGObject>=3.42; platform_system=='Linux'",
  "pycairo>=1.20; platform_system=='Linux'",
  "PyQt6>=6.5; platform_system=='Linux'",
  "PyQt6-WebEngine>=6.5; platform_system=='Linux'",
  "qtpy>=2.4; platform_system=='Linux'",
]
dev = [
  "ruff>=0.6",
  "pytest>=8",
]

[project.urls]
Homepage = "https://github.com/ciroautuori/whispy"
Repository = "https://github.com/ciroautuori/whispy"
Issues = "https://github.com/ciroautuori/whispy/issues"

[project.scripts]
whispy = "whispy.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["whispy"]

[tool.hatch.build.targets.wheel.force-include]
"web" = "whispy/../web"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"__main__.py" = ["E402"]
